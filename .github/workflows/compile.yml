name: Build Boot.img LineageOS 14.1 (SM-J111F)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

env:
  ARCH: arm
  SUBARCH: arm

jobs:
  build:
    name: Create LineageOS 14.1 Boot Image
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool xsltproc zip zlib1g-dev python2 libc6:i386 libncurses5:i386 libstdc++6:i386 file
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 2. Clone LineageOS 14.1 Kernel Source
      run: |
        git clone --depth=1 -b cm-14.1 https://github.com/djeman/android_kernel_samsung_sharkls kernel-source

    - name: 3. Clone Stock Kernel Source (Untuk Ambil Defconfig)
      run: |
        git clone --depth=1 https://github.com/Flopster101/android_kernel_samsung_j1acevelte stock-kernel

    - name: 4. Clone Toolchain GCC 4.9
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain

    - name: 5. Clone Base Repo (Untuk Ambil Boot.img Lama & AIK)
      run: |
        git clone https://github.com/icsriyand/build base-repo
        git clone https://github.com/ndrancs/AIK-Linux-x32-x64 AIK

    - name: 6. Deteksi dan Salin Defconfig Otomatis
      run: |
        # Mencari file defconfig J1 Ace di stock kernel
        STOCK_DEFCONFIG=$(find stock-kernel/arch/arm/configs/ -name "*j1acevelte*_defconfig" -maxdepth 1 | head -n 1)
        
        if [ -z "$STOCK_DEFCONFIG" ]; then
          echo "Defconfig tidak ditemukan di stock-kernel! Menggunakan fallback."
          STOCK_DEFCONFIG="stock-kernel/arch/arm/configs/j1acevelte_defconfig"
        fi
        
        DEFCONFIG_NAME=$(basename $STOCK_DEFCONFIG)
        echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" >> $GITHUB_ENV
        
        # Menyalin defconfig dari stock ke kernel LineageOS
        cp -v $STOCK_DEFCONFIG kernel-source/arch/arm/configs/
        echo "Berhasil menyalin $DEFCONFIG_NAME ke kernel-source."

    - name: 7. Auto-Patch Kernel Source
      run: |
        cd kernel-source
        # Perbaikan error kompilasi gcc kuno di Ubuntu modern
        if [ -f kernel/timeconst.pl ]; then sed -i 's/if (!defined(@val))/if (!@val)/g' kernel/timeconst.pl; fi
        if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped; fi
        find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +
        find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wno-implicit-function-declaration/g' {} +
        
        # Inject Status Permissive & Matikan Proteksi Samsung Knox
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> arch/arm/configs/$DEFCONFIG_NAME
        echo "CONFIG_SECURITY_SELINUX_AVC_STATS=y" >> arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_SECURITY_SELINUX_ENFORCE_PERMISSIVE=n/CONFIG_SECURITY_SELINUX_ENFORCE_PERMISSIVE=y/g' arch/arm/configs/$DEFCONFIG_NAME || echo "CONFIG_SECURITY_SELINUX_ENFORCE_PERMISSIVE=y" >> arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_SEC_RESTRICT_ROOT=y/# CONFIG_SEC_RESTRICT_ROOT is not set/g' arch/arm/configs/$DEFCONFIG_NAME
        sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' arch/arm/configs/$DEFCONFIG_NAME

    - name: 8. Kompilasi Kernel (ZImage)
      run: |
        cd kernel-source
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
        export ARCH=arm
        export SUBARCH=arm
        export KBUILD_BUILD_USER="Icsriyand"
        export KBUILD_BUILD_HOST="GitHub-Actions"
        
        make $DEFCONFIG_NAME
        make -j$(nproc)

    - name: 9. Repack Boot.img Menggunakan AIK
      run: |
        # Cari boot.img asli di dalam repositori build Anda
        OLD_BOOT=$(find base-repo -name "boot.img" | head -n 1)
        
        if [ -z "$OLD_BOOT" ]; then
          echo "Error: boot.img tidak ditemukan di repo https://github.com/icsriyand/build"
          exit 1
        fi
        
        # Salin boot.img lama ke folder AIK
        cp -v $OLD_BOOT AIK/boot.img
        cd AIK
        
        # Bongkar boot.img lama
        chmod +x unpackimg.sh repackimg.sh bin/magiskboot bin/androidbootimg
        ./unpackimg.sh boot.img
        
        # Ganti zImage bawaan lama dengan zImage LineageOS yang baru dicompile
        if [ -f ../kernel-source/arch/arm/boot/zImage ]; then
          cp -v ../kernel-source/arch/arm/boot/zImage split_img/boot.img-zImage
        else
          echo "Error: zImage baru tidak ditemukan!"
          exit 1
        fi
        
        # Rakit kembali menjadi boot.img baru
        ./repackimg.sh
        
        # Pindahkan hasilnya ke workspace utama
        cp -v image-new.img ../boot-lineage14.1-j1acevelte.img

    - name: 10. Upload Boot Image ke GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: LOS-14.1-Boot-${{ github.run_id }}
        name: Boot Image LineageOS 14.1 SM-J111F
        body: |
          Hasil kompilasi boot.img otomatis untuk SM-J111F.
          - Ramdisk: Diambil dari base ROM LineageOS 14.1 Anda.
          - Kernel: Dicompile menggunakan source sharkls dengan defconfig ${{ env.DEFCONFIG_NAME }}.
          - Status: Permissive & Knox Disabled.
        files: boot-lineage14.1-j1acevelte.img
