name: Compile Kernel & Build Boot.img SM-J111F (Auto-Config)

on:
  workflow_dispatch: # Dapat dijalankan manual lewat menu Actions di GitHub

jobs:
  build:
    runs-runs-on: ubuntu-20.04

    steps:
    - name: Mengatur Dependensi Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libpcap-dev zip unzip
        sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386

    - name: Clone Toolchain GCC 4.9
      run: |
        git clone https://googlesource.com -b master --depth=1 $GITHUB_WORKSPACE/toolchain

    - name: Clone Kernel LineageOS 14.1
      run: |
        git clone https://github.com/djeman/android_kernel_samsung_sharkls -b cm-14.1 --depth=1 $GITHUB_WORKSPACE/kernel

    - name: Clone Kernel Stock (Sumber Defconfig J1 Ace)
      run: |
        git clone https://github.com --depth=1 $GITHUB_WORKSPACE/stock_kernel

    - name: Deteksi Otomatis, Salin, dan Sinkronisasi Defconfig
      run: |
        # Cari file defconfig di repositori stock yang mengandung kata j1ace, j1, atau sharkls
        cd $GITHUB_WORKSPACE/stock_kernel/arch/arm/configs/
        
        FOUND_CONFIG=$(ls *defconfig* | grep -E "j1ace|j1|sharkls" | head -n 1)
        
        if [ -z "$FOUND_CONFIG" ]; then
          echo "Defconfig spesifik tidak ditemukan di repositori stock, mencari defconfig alternatif..."
          FOUND_CONFIG=$(ls *defconfig* | head -n 1)
        fi
        
        echo "Defconfig yang terdeteksi: $FOUND_CONFIG"
        
        # Salin defconfig dari stock ke kernel LineageOS dengan nama target otomatis
        cp "$FOUND_CONFIG" "$GITHUB_WORKSPACE/kernel/arch/arm/configs/lineage_j1ace_auto_defconfig"
        echo "Defconfig berhasil disalin ke LineageOS dengan nama: lineage_j1ace_auto_defconfig"

    - name: Download boot.img LineageOS 14.1 Anda
      run: |
        mkdir -p $GITHUB_WORKSPACE/workdir
        # Mendownload boot.img asli dari repositori build Anda
        curl -L "https://github.com" -o $GITHUB_WORKSPACE/workdir/boot.img || \
        curl -L "https://github.com" -o $GITHUB_WORKSPACE/workdir/boot.img

    - name: Clone Android Image Kitchen (AIK)
      run: |
        git clone https://github.com $GITHUB_WORKSPACE/AIK
        cd $GITHUB_WORKSPACE/AIK
        chmod +x unpackimg.sh repackimg.sh bin/magic

    - name: Proses Kompilasi Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        export ARCH=arm
        export CROSS_COMPILE=arm-linux-androideabi-
        
        cd $GITHUB_WORKSPACE/kernel
        
        # Menggunakan defconfig otomatis yang telah disalin sebelumnya
        make lineage_j1ace_auto_defconfig
        
        # Eksekusi kompilasi multi-core
        make -j$(nproc)

    - name: Bongkar boot.img & Ganti Kernel (zImage)
      run: |
        cd $GITHUB_WORKSPACE/AIK
        
        # Salin boot.img ke direktori kerja AIK
        cp $GITHUB_WORKSPACE/workdir/boot.img .
        
        # Bongkar paket boot.img
        ./unpackimg.sh
        
        # Periksa format keluaran kernel (biasanya zImage atau zImage-dtb)
        if [ -f "$GITHUB_WORKSPACE/kernel/arch/arm/boot/zImage-dtb" ]; then
          cp $GITHUB_WORKSPACE/kernel/arch/arm/boot/zImage-dtb split_img/boot.img-zImage
        else
          cp $GITHUB_WORKSPACE/kernel/arch/arm/boot/zImage split_img/boot.img-zImage
        fi
        
        # Kemas ulang image baru
        ./repackimg.sh
        
        # Amankan hasil modifikasi ke folder output
        mv image-new.img $GITHUB_WORKSPACE/workdir/boot-lineage14.1-sm-j111f.img

    - name: Membuat GitHub Release dan Unggah Hasil
      uses: softprops/action-gh-release@v1
      with:
        tag_name: Lineage-14.1-${{ github.run_number }}
        name: Boot.img LineageOS 14.1 J1 Ace (Build ${{ github.run_number }})
        draft: false
        prerelease: false
        files: |
          workdir/boot-lineage14.1-sm-j111f.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
